name = "cr-gaym-rooms"
main = "worker/index.ts"
compatibility_date = "2025-06-01"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "ChainReactionRoom" },
  # One instance, addressed by a constant name, holding every account. See
  # `worker/accounts.ts` for why this is a Durable Object and not D1: D1 needs a
  # `wrangler d1 create` against a real account, and this needs no setup at all.
  { name = "ACCOUNTS", class_name = "Accounts" }
]

# SQLite-backed, and that is not a preference.
#
# A free Cloudflare plan permits Durable Objects only through a
# `new_sqlite_classes` migration; the older `new_classes` form is rejected with
# "you must create a namespace using a new_sqlite_classes migration". This is
# exactly what no published PartyKit build could emit, which is why the room
# server is a plain Worker.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChainReactionRoom"]

# Accounts store rows rather than holding them in memory, so this one uses its
# SQLite for real. Same migration form and the same reason as above.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]
